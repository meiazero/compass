[project]
name = "compass"
version = "0.1.0"
description = "COMPASS intervals for segmentation area, adapted from Cheung et al. (2026)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# A library does not pin a torch build; the application that installs it does.
dependencies = [
    "lightgbm>=4.0",
    "numpy>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compass2d"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
